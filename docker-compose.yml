# Хранилище для аккаунтов, истории и избранного (локальная разработка и демонстрация).
# Пароли ниже — только для локального запуска, не для публичного сервера.
name: navigator
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: navigator
      POSTGRES_DB: navigator
    ports:
      - "5434:5432"
    volumes:
      - navigator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d navigator"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"
    depends_on:
      - postgres

volumes:
  navigator_pgdata:
