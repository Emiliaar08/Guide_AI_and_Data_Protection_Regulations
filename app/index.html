<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" />
    <meta name="description" content="Навигатор по документам об искусственном интеллекте и защите персональных данных." />
    <title>Право рядом — навигатор по нормативке</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Основная навигация">
        <a class="brand" href="#overview" data-nav="overview" aria-label="Право рядом — главная">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span class="brand-copy"><strong>право<span>рядом</span></strong><small>AI &amp; data navigator</small></span>
        </a>

        <div class="workspace-switcher">
          <span class="workspace-icon">N</span>
          <span><small>НАВИГАТОР</small><strong>ИИ и данные</strong></span>
        </div>

        <nav class="side-nav">
          <p class="nav-caption">РАБОЧЕЕ ПРОСТРАНСТВО</p>
          <button class="nav-item is-active" data-nav="overview"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="5.5" height="5.5" rx="1.4"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.4"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.4"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.4"/></svg><span>Обзор</span></button>
          <button class="nav-item" data-nav="scenarios"><svg viewBox="0 0 20 20"><path d="M4 4.5h12M4 10h12M4 15.5h7"/><circle cx="2.5" cy="4.5" r=".7"/><circle cx="2.5" cy="10" r=".7"/><circle cx="2.5" cy="15.5" r=".7"/></svg><span>Сценарии</span><span class="nav-count">06</span></button>
          <button class="nav-item" data-nav="sources"><svg viewBox="0 0 20 20"><path d="M5 3.5h7l3.5 3.7v9.3H5z"/><path d="M12 3.5v4h3.5M7.5 11h5M7.5 14h5"/></svg><span>Источники</span></button>
          <button class="nav-item" data-nav="compare"><svg viewBox="0 0 20 20"><path d="M6 3.5v13M14 3.5v13M3.5 7h5M11.5 13h5"/><circle cx="6" cy="5" r="2.5"/><circle cx="14" cy="11" r="2.5"/></svg><span>Сравнение</span></button>

          <p class="nav-caption nav-caption-spaced">ЛИЧНОЕ</p>
          <button class="nav-item" data-nav="saved"><svg viewBox="0 0 20 20"><path d="M5 3.5h10v13l-5-3.4-5 3.4z"/></svg><span>Сохранённое</span><span class="saved-count" id="saved-count">0</span></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card"><span class="help-spark">✳</span><strong>Нужен ориентир?</strong><p>Начните с вопроса о вашем продукте.</p><button data-nav="overview" data-focus-search>Открыть поиск <span>↗</span></button></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Открыть меню"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
          <div class="breadcrumbs"><span>Пространство</span><span class="crumb-divider">/</span><strong id="breadcrumb-current">Обзор</strong></div>
        </header>
        <div id="view" class="view-content" tabindex="-1"></div>
        <footer class="page-footer"><span>Право рядом <span class="footer-dot">·</span> Навигатор по нормативным документам</span></footer>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
