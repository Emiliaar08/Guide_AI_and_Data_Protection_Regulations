<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Открытие HTML двойным щелчком должно вести к приложению с работающим API.
      if (location.protocol === 'file:') location.replace('http://localhost:4173/' + location.hash);
    </script>
    <meta name="theme-color" content="#fcfcfa" />
    <meta name="description" content="Чат по нормативным документам об искусственном интеллекте и защите персональных данных." />
    <title>Право рядом</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./data.js" defer></script>
    <script src="./api.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H4l1.4-4.1A8 8 0 1 1 20 11.5Z"/><path d="M8 10h8M8 14h5"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-7-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-6-1-9 1Zm0 0v15"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9Z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6L9 15M11 5H5v14h14v-6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-mark" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 5l14 14M19 5 5 19"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></symbol>
    </svg>
    <a class="skip-link" href="#view">Перейти к содержимому</a>
    <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="Закрыть меню" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Основная навигация">
      <a class="brand" href="#chat" data-nav="chat"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-mark"/></svg></span><strong>право рядом</strong></a>
      <button class="new-chat-button" data-new-chat><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Новый чат<span class="shortcut" aria-hidden="true">⌘ K</span></button>
      <nav class="side-nav">
        <button class="nav-item" data-nav="chat"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><span>Чат</span></button>
        <button class="nav-item" data-nav="sources"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span>Источники</span></button>
        <button class="nav-item" data-nav="saved"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg><span>Избранное</span><span class="saved-count" id="saved-count">0</span></button>
      </nav>
      <section class="history-section" aria-labelledby="history-heading"><h2 class="nav-caption" id="history-heading">История</h2><div id="chat-history"></div></section>
      <div class="sidebar-account" id="sidebar-account"></div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Открыть меню" aria-expanded="false" aria-controls="sidebar"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <strong class="topbar-title" id="breadcrumb-current">Право рядом</strong>
        <button class="button button-secondary account-trigger" id="account-trigger" data-auth="login">Войти</button>
      </header>
      <div class="workspace-status" id="workspace-status" role="status" hidden></div>
      <div id="view" class="view-content" tabindex="-1"></div>
    </main>
    <dialog class="auth-dialog" id="auth-dialog" aria-labelledby="auth-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
